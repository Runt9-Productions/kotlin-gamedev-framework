name: Gradle build
description: >
  Runs `./gradlew build`, renders its TEST-SUMMARY counts and failure detail into the job summary, and fails when a
  test task discovered zero tests.

runs:
  using: composite
  steps:
    # shell: bash is what supplies pipefail, without which tee would swallow a failed build.
    - name: Build
      shell: bash
      run: ./gradlew build --console=plain | tee gradle.log

    # Runs even when the build failed, because a failed run is exactly when the counts are worth reading.
    # Assertion messages live only in the result XML, so a red run that prints none of them cannot be diagnosed
    # without re-running locally.
    - name: Summary
      if: always()
      shell: bash
      run: |
        {
          echo "### Tests"
          echo
          if grep -q '^TEST-SUMMARY' gradle.log; then
            echo '| Task | Result | Total | Passed | Failed | Skipped |'
            echo '|---|---|---:|---:|---:|---:|'
            grep '^TEST-SUMMARY' gradle.log | while read -r _ task result total passed failed skipped; do
              echo "| \`$task\` | $result | ${total#*=} | ${passed#*=} | ${failed#*=} | ${skipped#*=} |"
            done
          else
            echo 'No TEST-SUMMARY lines found. The suite did not run; check the build log above.'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # tee, not a plain redirect: $GITHUB_STEP_SUMMARY is a file the REST API does not expose, so summary-only
        # output is readable in the browser and invisible to anything fetching logs.
        python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
        import glob, xml.etree.ElementTree as ET

        # One entry per distinct message rather than per test: a fixture that fails in setup produces the
        # same exception dozens of times, and thirty identical stack traces bury the one fact worth reading.
        seen = {}
        for path in sorted(glob.glob("*/build/test-results/test/TEST-*.xml")):
            try:
                root = ET.parse(path).getroot()
            except ET.ParseError:
                continue
            for case in root.iter("testcase"):
                for bad in list(case.findall("failure")) + list(case.findall("error")):
                    text = (bad.get("message") or bad.text or "").strip()
                    key = "\n".join(text.splitlines()[:6])
                    seen.setdefault(key, []).append(f'{case.get("classname")}.{case.get("name")}')

        if seen:
            print("\n### Failures\n")
            for message, tests in seen.items():
                print(f"<details><summary>{tests[0]} "
                      f"{'and %d more' % (len(tests) - 1) if len(tests) > 1 else ''}</summary>\n")
                print("```")
                print(message or "(no message)")
                print("```")
                print("</details>\n")
        PY

    - name: Assert tests ran
      if: always()
      shell: bash
      run: |
        # Per line, not a sum across them. A sum only catches every module going empty at once; one module
        # silently discovering nothing stays green behind the others. A module with no test source emits no
        # TEST-SUMMARY line at all, so it is not caught here.
        empty=$(awk '/^TEST-SUMMARY/ { split($4, kv, "="); if (kv[2] + 0 == 0) print $2 }' gradle.log)
        if [[ -n $empty ]]; then
          echo "::error::Discovered zero tests in: $(tr '\n' ' ' <<< "$empty")." \
               "BUILD SUCCESSFUL on zero discovered tests is not a pass."
          exit 1
        fi

        total=$(awk '/^TEST-SUMMARY/ { split($4, kv, "="); sum += kv[2] } END { print sum + 0 }' gradle.log)
        if [[ $total -eq 0 ]]; then
          echo "::error::No task reported a test count at all. The suite did not run."
          exit 1
        fi
        echo "Ran $total tests."
