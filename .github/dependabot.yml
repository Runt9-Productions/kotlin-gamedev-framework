version: 2
# One pull request a week carries every ecosystem's updates, so they merge together rather than each waiting on a
# rebase after the one before.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: gradle
    # /buildSrc as well as /: Dependabot reads gradle/libs.versions.toml only at a configured directory's own root,
    # so from / alone buildSrc's catalog (the Kotlin, serialization, Kover and versions plugins) is never updated.
    directories:
      - /
      - /buildSrc
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
