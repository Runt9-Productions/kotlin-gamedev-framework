name: PR

# `gate` is the one required check. Docs-only PRs are skipped by the `changes` job, never by a paths-ignore on the
# trigger: a required check whose workflow never starts leaves the PR waiting on it forever.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        name: Detect a change outside docs and .claude
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -qvE '(\.md$|^\.claude/)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or .claude changed; skipping tests."
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/gradle-build

  # A merge into master releases only when gradle.properties names an untagged version, so a PR that changes what
  # gets published without bumping it would merge cleanly and release nothing.
  version:
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump when published code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The published modules and the build that assembles them. Unit tests ship in no jar; test fixtures do.
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD -- \
            core api buildSrc gradle build.gradle.kts settings.gradle.kts \
            ':(exclude)core/src/test' ':(exclude)api/src/test')"

          if [ -z "$CHANGED" ]; then
            echo "Nothing published changed."
            exit 0
          fi

          version_at() { git show "$1:gradle.properties" | sed -n 's/^version=//p' | tr -d '[:space:]'; }
          BASE_VERSION="$(version_at "$BASE_SHA")"
          HEAD_VERSION="$(version_at HEAD)"

          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Published code changed but gradle.properties is still $BASE_VERSION. Bump version; the merge releases it."
            echo "$CHANGED"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$HEAD_VERSION" > /dev/null; then
            echo "::error::$HEAD_VERSION is already released. Bump to the next version."
            exit 1
          fi

  # No skip on any PR: a docs-only or .claude-only PR is exactly the one that changes what agents are told.
  guard:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scripts run as the base branch has them, so a PR cannot weaken the check that judges it. The bot can
      # edit .github/scripts but not this file (it has no `workflows` permission), which is what makes this step
      # hold. A script the PR adds has no base copy and runs as the PR wrote it.
      - name: Take the check scripts from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts="$RUNNER_TEMP/scripts"
          mkdir -p "$scripts"
          cp -r .github/scripts/. "$scripts"
          if git cat-file -e "$BASE_SHA:.github/scripts" 2>/dev/null; then
            git archive "$BASE_SHA" .github/scripts | tar -x --strip-components=2 -C "$scripts"
          fi
          echo "SCRIPTS=$scripts" >> "$GITHUB_ENV"

      - name: Lint agent-instruction, hook and CI files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "$SCRIPTS/guard.py" "$BASE_SHA" "$HEAD_SHA"

  # Runs even when a job it needs failed: with a plain `needs` this job would be skipped, and GitHub passes a
  # skipped required check. A job skipped by its own `if` (tests on a docs-only PR) is fine.
  gate:
    needs: [changes, test, version, guard]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any needed job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
