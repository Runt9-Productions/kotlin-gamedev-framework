name: Gradle build

# Runs `./gradlew build` for pr.yml and publish.yml, and fails when a test task discovered zero tests. Keep it a
# workflow rather than a composite action under .github/actions: the App `workflows` permission, which the bot does
# not hold, covers only .github/workflows, so only here is the assertion out of the bot's reach.
on:
  workflow_call:

# An explicit bash is what supplies pipefail; the implicit default does not, and tee would swallow a failed build.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew build --console=plain | tee gradle.log

      # Runs even when the build failed, because a failed run is exactly when the counts are worth reading.
      - name: Assert tests ran
        if: always()
        run: |
          {
            echo '### Tests'
            echo '```'
            grep '^TEST-SUMMARY' gradle.log || echo 'No TEST-SUMMARY line: no test task ran.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! grep -q '^TEST-SUMMARY' gradle.log; then
            echo "::error::No test task reported a count. The suite did not run."
            exit 1
          fi

          # Per task: one module discovering nothing stays green behind the others in any total. A module with no
          # test source prints no line at all, so it is not caught here.
          empty="$(awk '/^TEST-SUMMARY/ && / total=0 / { print $2 }' gradle.log)"
          if [[ -n $empty ]]; then
            echo "::error::Discovered zero tests in: ${empty//$'\n'/ }." \
                 "BUILD SUCCESSFUL on zero discovered tests is not a pass."
            exit 1
          fi

      # Assertion messages live only in the result XML, so without this a red run cannot be diagnosed without
      # re-running locally. Renders one block per distinct message:
      #
      #   <details><summary>com.example.FooTest.bar and 2 more</summary>
      #   ```
      #   expected:<1> but was:<2>
      #   ```
      #   </details>
      - name: Failure messages
        if: always()
        shell: python3 {0}
        run: |
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          MESSAGE_LINES = 6

          # Keyed by message rather than by test: a fixture failing in setup raises the same exception dozens of
          # times, and thirty identical stack traces bury the one fact worth reading.
          failures = {}
          for path in sorted(Path().glob("*/build/test-results/test/TEST-*.xml")):
              for case in ET.parse(path).iter("testcase"):
                  for bad in case.findall("failure") + case.findall("error"):
                      text = (bad.get("message") or bad.text or "").strip()
                      message = "\n".join(text.splitlines()[:MESSAGE_LINES]) or "(no message)"
                      failures.setdefault(message, []).append(f"{case.get('classname')}.{case.get('name')}")

          lines = []
          for message, tests in failures.items():
              more = f" and {len(tests) - 1} more" if len(tests) > 1 else ""
              lines += [f"<details><summary>{tests[0]}{more}</summary>", "", "```", message, "```", "</details>", ""]

          if lines:
              report = "\n".join(["### Failures", "", *lines])
              # Printed as well: the REST API does not expose the step summary, so the log is the only copy
              # anything fetching logs can read.
              print(report)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(report + "\n")
