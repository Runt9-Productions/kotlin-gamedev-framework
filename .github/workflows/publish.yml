name: Publish

# The tag is the version. gradle.properties carries a version too, but it is only the default for local builds --
# what ships is whatever the tag says, so the two cannot disagree in a published artifact.
on:
  push:
    tags: ['*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest

    # packages:write is the whole point of publishing from here: the token exists for one run and nothing
    # write-capable has to sit in a developer's gradle.properties.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Not guarding the published version -- `-Pversion` below already settles that, whatever the file says. This
      # guards the file from lying: it is what someone reads to find out what kgdfw is at, and a consumer pinning
      # a number that was never released fails downstream as an unresolvable dependency with no hint of the cause.
      - name: Assert gradle.properties matches the tag
        run: |
          FILE_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"

          if [ "$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but gradle.properties says ${FILE_VERSION:-<unset>}. Bump the file, then move the tag onto the new commit."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew -Pversion="${{ github.ref_name }}" publish
        env:
          # Read by the GitHubPackages repository in kgdfw-common-plugin.gradle.kts. GITHUB_ACTOR is set by the
          # runner already, so only the token needs passing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
