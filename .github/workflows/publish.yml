name: Publish

# A merge into master releases the version gradle.properties names, unless that version is already tagged (a merge
# that changed nothing published). The tag is pushed after the publish with the run's own token, and GitHub starts
# no workflow run for a push made with that token, so the tag trigger below fires only for a tag pushed by hand.
on:
  push:
    branches: [master]
    tags: ['*.*.*']

# Two merges in quick succession would otherwise both see their version untagged.
concurrency: publish

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: version
        run: |
          FILE_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"

          if [ -z "$FILE_VERSION" ]; then
            echo "::error::gradle.properties has no version."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag is $GITHUB_REF_NAME but gradle.properties says $FILE_VERSION. Bump the file, then move the tag onto the new commit."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$FILE_VERSION" > /dev/null; then
            echo "$FILE_VERSION is already tagged, so this merge releases nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

  # A job of its own so the tests never run with the write token in reach: checkout leaves the token in
  # .git/config, readable by every test and every test dependency.
  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/gradle-build

  # A failed or cancelled test job skips this one, so nothing is published and no tag is pushed.
  publish:
    needs: [version, test]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest

    # packages:write is the whole point of publishing from here: the token exists for one run and nothing
    # write-capable has to sit in a developer's gradle.properties. contents:write pushes the tag.
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: ./gradlew -Pversion="${{ needs.version.outputs.version }}" publish
        env:
          # Read by the GitHubPackages repository in kgdfw-common-plugin.gradle.kts. GITHUB_ACTOR is set by the
          # runner already, so only the token needs passing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the publish, so a failed publish leaves the version untagged and the next merge retries it.
      - name: Tag the release
        if: github.ref_type == 'branch'
        run: |
          git tag "${{ needs.version.outputs.version }}"
          git push origin "refs/tags/${{ needs.version.outputs.version }}"
